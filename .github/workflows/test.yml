name: Test

# Remote verification of this repo's public contract: SwiftTUITerminalView builds
# from a fresh clone with native tools only, resolving swift-tui through its
# public tagged HTTPS dependency, and its test suite and public API baseline
# pass. This runs the same command as the org root's
# //:swift_tui_terminal_view_native_gate (swiftly-managed `swift test` + API check),
# so a red here means the org gate would be red too.
# There is no WASI lane: SwiftTerm and PTY process hosting are unsupported there.
#
# Lane shape:
#   * push / pull_request  — Linux tests and API baseline; pushes also run
#                            macOS if its lane inputs changed.
#   * tag push (`*.*.*`)   — the above plus a release-configuration build on
#                            Linux and the macOS suite; a release needs all of
#                            them green.
#   * nightly schedule     — the macOS suite, guarded by lane-verdict-probe so
#                            it exits in under a minute when nothing has
#                            landed since its last green run.
#   * workflow_dispatch    — everything, on demand.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*.*.*"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-view-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLY_VERSION: "1.1.4"

jobs:
  linux:
    name: SwiftTUITerminalView tests (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Swift dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Cache Swiftly toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/swiftly
            ~/.local/bin/swiftly
          key: ${{ runner.os }}-swiftly-${{ env.SWIFTLY_VERSION }}-${{ hashFiles('.swift-version') }}
          restore-keys: |
            ${{ runner.os }}-swiftly-${{ env.SWIFTLY_VERSION }}-

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          export SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          export SWIFTLY_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$SWIFTLY_BIN_DIR"
          export PATH="$SWIFTLY_BIN_DIR:$PATH"

          if ! command -v swiftly >/dev/null 2>&1 || [ ! -f "${SWIFTLY_HOME_DIR}/env.sh" ]; then
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            cd "$tmpdir"
            swiftly_archive="swiftly-${SWIFTLY_VERSION}-$(uname -m).tar.gz"
            curl -fsSLO "https://download.swift.org/swiftly/linux/${swiftly_archive}"
            tar -zxf "$swiftly_archive"
            ./swiftly init --skip-install --quiet-shell-followup --assume-yes
          fi

          . "${SWIFTLY_HOME_DIR}/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.swift-version")"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run native gate
        shell: bash
        run: |
          set -euo pipefail
          . "${SWIFTLY_HOME_DIR}/env.sh"
          Scripts/native_gate.sh

      # Release-configuration coverage belongs to the tag lane (and to an
      # explicit dispatch). Ordinary pushes validate the debug build.
      - name: Release build
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          . "${SWIFTLY_HOME_DIR}/env.sh"
          swiftly run swift build -c release

  # Skip-if-unchanged guard for the macOS lane. Dispatch and tag pushes
  # always run; ordinary pushes and schedules can reuse a green verdict.
  changes:
    name: Skip macOS lane if unchanged
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      key: ${{ steps.probe.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Probe the lane verdict
        id: probe
        uses: ./.github/actions/lane-verdict-probe
        with:
          lane: terminal-view-macos

  macos:
    name: SwiftTUITerminalView tests (macOS)
    # The probe decides whether this revision needs macOS verification.
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Swiftly toolchain
        uses: actions/cache@v6
        with:
          # ~/.swiftly holds swiftly's registry, but macOS toolchains install
          # to ~/Library/Developer/Toolchains — caching only the registry
          # makes every cache-hit run fail with "already installed" while the
          # toolchain directory is absent. Cache both, keyed together.
          path: |
            ~/.swiftly
            ~/Library/Developer/Toolchains
          key: ${{ runner.os }}-swiftly-1.1.4-toolchain-${{ hashFiles('.swift-version') }}
          restore-keys: |
            ${{ runner.os }}-swiftly-1.1.4-toolchain-

      - name: Install swiftly and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.swiftly/env.sh" ]; then
            curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
            "$HOME/.swiftly/bin/swiftly" init --skip-install --quiet-shell-followup --assume-yes
          fi
          . "$HOME/.swiftly/env.sh"
          hash -r
          swift_version="$(tr -d '[:space:]' < .swift-version)"
          swiftly install --use --assume-yes "$swift_version"
          swiftly run swift --version
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$HOME/.swiftly" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run native gate
        shell: bash
        run: Scripts/native_gate.sh

  record-macos-verdict:
    name: Record macOS lane verdict
    needs: [changes, macos]
    if: needs.changes.outputs.changed == 'true' && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record the green verdict
        uses: ./.github/actions/lane-verdict-record
        with:
          key: ${{ needs.changes.outputs.key }}
